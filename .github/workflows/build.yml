name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          mkdir -p /tmp/gen
          flutter create --platforms=android --org com.example --project-name fake_call_app /tmp/gen
          cp -r /tmp/gen/android ./android
          cp src/pubspec.yaml ./pubspec.yaml
          mkdir -p lib
          cp src/main.dart lib/main.dart

      - name: Add vibrate permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Fake Call"#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: fake-call-apk
          path: build/app/outputs/flutter-apk/app-release.apk
