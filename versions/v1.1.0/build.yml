name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned so the Android toolchain (Kotlin 1.8 / AGP 8.1) matches the plugins
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Generate Android project and apply our files
        shell: bash
        run: |
          mkdir -p /tmp/gen
          flutter create --platforms=android --org com.example --project-name contact_book /tmp/gen
          cp -r /tmp/gen/android ./android
          cp src/pubspec.yaml ./pubspec.yaml
          mkdir -p lib
          cp src/main.dart lib/main.dart

          # Native bridge: keep the generated package line, use our code
          MA=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          PKG=$(grep -m1 '^package ' "$MA")
          sed "1s|.*|$PKG|" src/android/MainActivity.kt > "$MA"

          # App icon
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "src/icons/mipmap-$d/ic_launcher.png" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done

      - name: Manifest permissions and app name
        shell: bash
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.READ_CONTACTS"/>\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="Contact Book"#' "$M"

      - run: flutter pub get

      - name: Build release APK
        shell: bash
        run: flutter build apk --release 2>&1 | tee build.log

      - name: Show the real error (only on failure)
        if: failure()
        shell: bash
        run: grep -n -B3 -A25 -E "What went wrong|error:|Error:" build.log | head -150

      - name: Name the APK with its version
        shell: bash
        run: |
          VERSION=$(grep '^version:' src/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp build/app/outputs/flutter-apk/app-release.apk "ContactBook-v$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: contact-book-v${{ env.VERSION }}
          path: ContactBook-v${{ env.VERSION }}.apk
