name: contact_book
description: Contacts and dialer utility.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_ringtone_player: ^4.0.0+4
  vibration: ^2.0.0
  wakelock_plus: 1.2.8

# Newer package_info_plus needs Kotlin 2.x, which breaks the build here.
dependency_overrides:
  package_info_plus: 8.0.2

flutter:
  uses-material-design: true
