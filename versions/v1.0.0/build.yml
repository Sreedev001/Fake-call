name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned Flutter version so the Android toolchain matches the plugins
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p /tmp/gen
          flutter create --platforms=android --org com.example --project-name fake_call_app /tmp/gen
          cp -r /tmp/gen/android ./android
          cp src/pubspec.yaml ./pubspec.yaml
          mkdir -p lib
          cp src/main.dart lib/main.dart

      - name: Add vibrate permission
        shell: bash
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="Fake Call"#' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Build release APK
        shell: bash
        run: flutter build apk --release 2>&1 | tee build.log

      - name: Show the real error (only on failure)
        if: failure()
        shell: bash
        run: grep -n -B3 -A25 -E "What went wrong|error:|Error:" build.log | head -120

      - uses: actions/upload-artifact@v4
        with:
          name: fake-call-apk
          path: build/app/outputs/flutter-apk/app-release.apk
